        }
        .lang-btn, .voice-btn {

            cursor: pointer;
            font-size: 13px;
        }
        .voice-btn {
            background: #ffeb3b;
            color: #333;
        }
        .header {
            background-color: #1e5631;
            color: white;
            padding: 20px;
            text-align: center;
        }

            font-size: 22px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .form-body {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 15px;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: #1e5631;
        }
        .state-info-card {
            background: #fff8e1;
            border-left: 5px solid #ffc107;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #b78103;
            display: none;
        }
        .btn-submit {
            width: 100%;
            background-color: #1e5631;
            color: white;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #143d22;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #e8f5e9;
            border-left: 5px solid #1e5631;
            border-radius: 4px;
            display: none;
        }
        .result-box h3 {
            color: #1e5631;
            margin-bottom: 10px;

            background: #fff;
            padding: 12px;
            border-radius: 8px;

            font-size: 14px;

        </div>

        <!-- 4. Crop Selection -->

            <label id="lblCrop">4. फसल/सब्जी चुनें (Select Crop)</label>

        </div>

            </div>

            <p id="resDetails"></p>
            
            <div class="chart-container">

            </div>

            <a id="whatsappShare" href="#" target="_blank" class="whatsapp-btn">💬 WhatsApp पर शेयर करें</a>
        </div>
    </div>
</div>

    window.onload = function() {
        const stateSelect = document.getElementById('stateSelect');
        for (let state in data) {
            let option = document.createElement('option');
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option);
        }
    };

    function onStateChange() {
        const state = document.getElementById('stateSelect').value;
        const districtSelect = document.getElementById('districtSelect');
        const mandiSelect = document.getElementById('mandiSelect');
        const cropSelect = document.getElementById('cropSelect');
        const stateInfoCard = document.getElementById('stateInfoCard');
        const stateInfoText = document.getElementById('stateInfoText');

        districtSelect.innerHTML = `<option value="">--` + (currentLang === 'hi' ? 'जिला चुनें' : 'Select District') + `--</option>`;
        mandiSelect.innerHTML = `<option value="">--` + (currentLang === 'hi' ? 'पहले जिला चुनें' : 'Select District First') + `--</option>`;
        cropSelect.innerHTML = `<option value="">--` + (currentLang === 'hi' ? 'सब्जी या फसल चुनें' : 'Select Crop') + `--</option>`;

        if (state && data[state]) {
            data[state].districts.forEach(district => {
                let option = document.createElement('option');
                option.value = district;
                option.textContent = district;
                districtSelect.appendChild(option);
            });
            for (let crop in data[state].crops) {
                let option = document.createElement('option');
                option.value = crop;
                option.textContent = crop + " (Base ₹" + data[state].crops[crop] + "/kg)";
                cropSelect.appendChild(option);
            }
            stateInfoCard.style.display = 'block';
            stateInfoText.textContent = data[state].topCrop;
        } else {
            stateInfoCard.style.display = 'none';
        }
    }

    function onDistrictChange() {
        const state = document.getElementById('stateSelect').value;
        const district = document.getElementById('districtSelect').value;
        const mandiSelect = document.getElementById('mandiSelect');

        mandiSelect.innerHTML = `<option value="">--` + (currentLang === 'hi' ? 'मंडी चुनें' : 'Select Mandi') + `--</option>`;

        if (state && district) {
            const mandis = [`${district} मुख्य मंडी (APMC)`, `${district} उप-मंडी केंद्र`, `${district} ग्रामीण हाट बाजार`];
            mandis.forEach(mandi => {
                let option = document.createElement('option');
                option.value = mandi;
                option.textContent = mandi;
                mandiSelect.appendChild(option);
            });
        }
    }

    let priceChartInstance = null;

    function showPrice() {
        const state = document.getElementById('stateSelect').value;
        const district = document.getElementById('districtSelect').value;
        const mandi = document.getElementById('mandiSelect').value;
        const crop = document.getElementById('cropSelect').value;

        if (!state || !district || !mandi || !crop) {
            alert(currentLang === 'hi' ? "कृपया सभी विकल्प (राज्य, जिला, मंडी, फसल) चुनें!" : "Please select all options (State, District, Mandi, Crop)!");
            return;
        }

        // --- UNIQUE DYNAMIC PRICE LOGIC FOR EVERY DISTRICT ---
        // Yeh code district ke naam ke text ki length aur characters ko use karke ek alag offset banata hai
        let charSum = 0;
        for (let i = 0; i < district.length; i++) {
            charSum += district.charCodeAt(i);
        }
        let randomFactor = (charSum % 7) - 3; // -3 se +3 tak ka badlav aayega har district mein
        
        const originalBase = data[state].crops[crop] || 30;
        const basePrice = Math.max(10, originalBase + randomFactor); // Har district ka price alag ho jayega
        
        const minPrice = Math.round(basePrice * 0.9);
        const maxPrice = Math.round(basePrice * 1.15);

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';

        const resTitle = document.getElementById('resTitle');
        const resDetails = document.getElementById('resDetails');
        const whatsappShare = document.getElementById('whatsappShare');

        if (currentLang === 'hi') {
            resTitle.textContent = `📊 ${crop} के वर्तमान भाव (${mandi}, ${district})`;
            resDetails.innerHTML = `<b>राज्य:</b> ${state} <br><b>जिला:</b> ${district} <br><b>मंडी:</b> ${mandi} <br><b>फसल:</b> ${crop} <br><br>🟢 <b>न्यूनतम भाव:</b> ₹${minPrice} / किग्रा<br>🔵 <b>औसत/वर्तमान भाव:</b> ₹${basePrice} / किग्रा<br>🟠 <b>अधिकतम भाव:</b> ₹${maxPrice} / किग्रा<br><br>💡 <i>AI पूर्वानुमान:</i> ${district} की इस मंडी में स्थानीय मांग के आधार पर भाव अपडेट किए गए हैं।`;
            whatsappShare.textContent = "💬 WhatsApp पर शेयर करें";
            whatsappShare.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(`AGRO PRICE: ${crop} भाव ${mandi} (${district}, ${state}) में न्यूनतम ₹${minPrice} से अधिकतम ₹${maxPrice} प्रति किग्रा है।`)}`;
        } else {
            resTitle.textContent = `📊 Current Rates for ${crop} at ${mandi}, ${district}`;
            resDetails.innerHTML = `<b>State:</b> ${state} <br><b>District:</b> ${district} <br><b>Mandi:</b> ${mandi} <br><b>Crop:</b> ${crop} <br><br>🟢 <b>Min Price:</b> ₹${minPrice} / kg<br>🔵 <b>Average Price:</b> ₹${basePrice} / kg<br>🟠 <b>Max Price:</b> ₹${maxPrice} / kg<br><br>💡 <i>AI Forecast:</i> Rates updated based on local mandi demand in ${district}.`;
            whatsappShare.textContent = "💬 Share on WhatsApp";
            whatsappShare.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(`AGRO PRICE: ${crop} rate at ${mandi} (${district}, ${state}) ranges from ₹${minPrice} to ₹${maxPrice} per kg.`)}`;
        }

        const ctx = document.getElementById('priceChart').getContext('2d');
        if (priceChartInstance) {
            priceChartInstance.destroy();
        }

        priceChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['5 Days Ago', '4 Days Ago', '3 Days Ago', '2 Days Ago', 'Yesterday', 'Today (Live)', 'Expected Tomorrow'],
                datasets: [{
                    label: `${crop} Price Trend (₹/kg)`,
                    data: [
                        Math.round(basePrice * 0.95),
                        Math.round(basePrice * 0.97),
                        Math.round(basePrice * 0.94),
                        Math.round(basePrice * 0.98),
                        Math.round(basePrice),
                        basePrice,
                        Math.round(basePrice * 1.05)
                    ],
                    borderColor: '#1e5631',
                    backgroundColor: 'rgba(30, 86, 49, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top' }
                },
                scales: {
                    y: { beginAtZero: false }
                }
            }
        });
    }

    function toggleLanguage() {
        currentLang = currentLang === 'hi' ? 'en' : 'hi';
        const t = translations[currentLang];

        document.getElementById('mainTitle').textContent = t.title;
        document.getElementById('subTitle').textContent = t.subtitle;
        document.getElementById('lblState').textContent = t.lblState;
        document.getElementById('lblDistrict').textContent = t.lblDistrict;
        document.getElementById('lblMandi').textContent = t.lblMandi;
        document.getElementById('lblCrop').textContent = t.lblCrop;
        document.getElementById('btnSubmitText').textContent = t.btnText;
        document.getElementById('voiceBtnText').textContent = t.voiceBtn;

        if (!document.getElementById('stateSelect').value) {
            document.getElementById('stateSelect').options[0].text = t.defaultState;
            document.getElementById('districtSelect').options[0].text = t.defaultDistrict;
            document.getElementById('mandiSelect').options[0].text = t.defaultMandi;
            document.getElementById('cropSelect').options[0].text = t.defaultCrop;
        }
    }

    function startVoiceSearch() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert(currentLang === 'hi' ? "आपका ब्राउज़र वॉइस सर्च का समर्थन नहीं करता है।" : "Your browser does not support voice search.");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = currentLang === 'hi' ? 'hi-IN' : 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = function() {
            alert(currentLang === 'hi' ? "सुन रहे हैं... बोलिए (राज्य का नाम)" : "Listening... Please speak state name.");
        };

        recognition.onresult = function(event) {
            const speechResult = event.results[0][0].transcript.toLowerCase();
            const stateSelect = document.getElementById('stateSelect');
            for (let i = 0; i < stateSelect.options.length; i++) {
                if (stateSelect.options[i].text.toLowerCase().includes(speechResult)) {
                    stateSelect.selectedIndex = i;
                    onStateChange();
                    break;
                }
            }
        };

        recognition.start();
    }
</script>
