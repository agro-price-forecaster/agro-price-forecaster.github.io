<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेशनल एग्री-प्राइस प्रेडिक्शन मॉडल V4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
        }
        .header {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 20px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            color: #444;
            background-color: #fff;
            outline: none;
            transition: border 0.3s;
        }
        .form-group select:focus {
            border-color: #2e7d32;
        }
        .btn {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #1b5e20;
        }
        .result-card {
            display: none;
            background: #e8f5e9;
            border-left: 6px solid #2e7d32;
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            animation: slideDown 0.3s ease-in-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card h3 {
            color: #1b5e20;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px dashed #a5d6a7;
            padding-bottom: 6px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
            color: #333;
        }
        .price-val {
            font-weight: bold;
            color: #2e7d32;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌾 नेशनल एग्री-प्राइस प्रेडिक्शन मॉडल V4</h1>
        <p>वास्तविक राज्यवार मंडी भाव एवं लाइव कृषि उत्पादन भौगोलिक डेटा | डेवलपर: प्रतीक कुमार</p>
    </div>

    <div class="container">
        <!-- 1. Hardcoded 28 States Dropdown -->
        <div class="form-group">
            <label>1. राज्य चुनें (Select State)</label>
            <select id="stateSelect" onchange="updateMandisStatic()">
                <option value="">--राज्य चुनें / Select State--</option>
                <option value="Andhra Pradesh">Andhra Pradesh (आंध्र प्रदेश)</option>
                <option value="Arunachal Pradesh">Arunachal Pradesh (अरुणाचल प्रदेश)</option>
                <option value="Assam">Assam (असम)</option>
                <option value="Bihar">Bihar (बिहार)</option>
                <option value="Chhattisgarh">Chhattisgarh (छत्तीसगढ़)</option>
                <option value="Goa">Goa (गोवा)</option>
                <option value="Gujarat">Gujarat (गुजरात)</option>
                <option value="Haryana">Haryana (हरियाणा)</option>
                <option value="Himachal Pradesh">Himachal Pradesh (हिमाचल प्रदेश)</option>
                <option value="Jharkhand">Jharkhand (झारखंड)</option>
                <option value="Karnataka">Karnataka (कर्नाटक)</option>
                <option value="Kerala">Kerala (केरल)</option>
                <option value="Madhya Pradesh">Madhya Pradesh (मध्य प्रदेश)</option>
                <option value="Maharashtra">Maharashtra (महाराष्ट्र)</option>
                <option value="Manipur">Manipur (मणिपुर)</option>
                <option value="Meghalaya">Meghalaya (मेघालय)</option>
                <option value="Mizoram">Mizoram (मिजोरम)</option>
                <option value="Nagaland">Nagaland (नागालैंड)</option>
                <option value="Odisha">Odisha (ओडिशा)</option>
                <option value="Punjab">Punjab (पंजाब)</option>
                <option value="Rajasthan">Rajasthan (राजस्थान)</option>
                <option value="Sikkim">Sikkim (सिक्किम)</option>
                <option value="Tamil Nadu">Tamil Nadu (तमिलनाडु)</option>
                <option value="Telangana">Telangana (तेलंगाना)</option>
                <option value="Tripura">Tripura (त्रिपुरा)</option>
                <option value="Uttar Pradesh">Uttar Pradesh (उत्तर प्रदेश)</option>
                <option value="Uttarakhand">Uttarakhand (उत्तराखंड)</option>
                <option value="West Bengal">West Bengal (पश्चिम बंगाल)</option>
            </select>
        </div>

        <!-- 2. Dynamic Mandi Dropdown -->
        <div class="form-group">
            <label>2. मंडी चुनें (Select Mandi)</label>
            <select id="mandiSelect">
                <option value="">--पहले राज्य चुनें / Select State First--</option>
            </select>
        </div>

        <!-- 3. Hardcoded Vegetables Dropdown -->
        <div class="form-group">
            <label>3. फसल/सब्जी चुनें (Select Crop)</label>
            <select id="cropSelect">
                <option value="">--सब्जी या फसल चुनें / Select Crop--</option>
                <option value="आलू (Potato)">आलू (Potato)</option>
                <option value="प्याज (Onion)">प्याज (Onion)</option>
                <option value="टमाटर (Tomato)">टमाटर (Tomato)</option>
                <option value="लहसुन (Garlic)">लहसुन (Garlic)</option>
                <option value="अदरक (Ginger)">अदरक (Ginger)</option>
                <option value="हरी मिर्च (Green Chillies)">हरी मिर्च (Green Chillies)</option>
                <option value="गोभी (Cauliflower)">गोभी (Cauliflower)</option>
                <option value="बैंगन (Brinjal)">बैंगन (Brinjal)</option>
                <option value="भिंडी (Lady Finger)">भिंडी (Lady Finger)</option>
                <option value="चना (Gram)">चना (Gram)</option>
                <option value="गेहूं (Wheat)">गेहूं (Wheat)</option>
            </select>
        </div>

        <!-- Submit Search Button -->
        <button class="btn" onclick="executePriceSearch()">
            AI प्रेडिक्शन और चार्ट देखें 🚀
        </button>

        <!-- Final Price Result Container Box -->
        <div class="result-card" id="priceOutputCard">
            <h3 id="resTitle">📊 लाइव मंडी भाव रिकॉर्ड</h3>
            <div class="price-row"><span>न्यूनतम भाव (Min Price):</span> <span class="price-val" id="minPrice">₹0 /kg</span></div>
            <div class="price-row"><span>अधिकतम भाव (Max Price):</span> <span class="price-val" id="maxPrice">₹0 /kg</span></div>
            <div class="price-row"><span>औसत भाव (Modal Price):</span> <span class="price-val" id="avgPrice">₹0 /kg</span></div>
        </div>
    </div>
