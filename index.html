<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Agri-Price Forecaster V4</title>
    <!-- 📈 चार्ट्स लोड करने के लिए Chart.js लाइब्रेरी -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #f1f8e9;
            --dark-color: #263238;
            --light-color: #ffffff;
            --accent-color: #f57c00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            color: var(--dark-color);
        }

        header {
            background-color: var(--primary-color);
            color: var(--light-color);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .search-card {
            background-color: var(--light-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 25px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .grid-layout {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background-color: #fff;
            outline: none;
        }

        .btn-predict {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--light-color);
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-predict:hover {
            background-color: #1b5e20;
        }

        .info-box {
            background-color: #fff8e1;
            border-left: 5px solid var(--accent-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
        }

        .info-box h3 {
            margin: 0 0 8px 0;
            color: #e65100;
            font-size: 16px;
        }

        .result-section {
            background-color: var(--light-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            display: none;
            text-align: center;
        }

        .price-box {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .price-card {
            background-color: var(--secondary-color);
            padding: 15px;
            border-radius: 8px;
            width: 44%;
            border-left: 5px solid var(--primary-color);
        }

        .price-value {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0 0 0;
        }

        .chart-container {
            position: relative;
            margin-top: 25px;
            height: 320px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌾 नेशनल एग्री-प्राइस प्रेडिक्शन मॉडल V4</h1>
        <p>वास्तविक राज्यवार मंडी भाव एवं लाइव कृषि उत्पादन भौगोलिक डेटा | डेवलपर: प्रतीक कुमार</p>
    </header>

    <div class="container">
        <div class="search-card">
            <div class="grid-layout">
                <div>
                    <label for="state">1. राज्य चुनें (Select State)</label>
                    <select id="state" onchange="updateOptions()">
                        <option value="Maharashtra">Maharashtra (महाराष्ट्र)</option>
                        <option value="Uttar Pradesh">Uttar Pradesh (उत्तर प्रदेश)</option>
                        <option value="Delhi">Delhi (दिल्ली)</option>
                        <option value="Punjab">Punjab (पंजाब)</option>
                        <option value="Rajasthan">Rajasthan (राजस्थान)</option>
                        <option value="Madhya Pradesh">Madhya Pradesh (मध्य प्रदेश)</option>
                        <option value="West Bengal">West Bengal (पश्चिम बंगाल)</option>
                        <option value="Andhra Pradesh">Andhra Pradesh (आंध्र प्रदेश)</option>
                        <option value="Karnataka">Karnataka (कर्नाटक)</option>
                        <option value="Bihar">Bihar (बिहार)</option>
                    </select>
                </div>
                <div>
                    <label for="mandi">2. मंडी चुनें (Select Mandi)</label>
                    <select id="mandi">
                        <!-- जावास्क्रिप्ट से लोड होगी -->
                    </select>
                </div>
                <div>
                    <label for="crop">3. फसल/सब्जी चुनें (Select Crop)</label>
                    <select id="crop" onchange="showCropGrowthInfo()">
                        <option value="wheat">गेहूं (Wheat)</option>
                        <option value="rice">धान/चावल (Rice)</option>
                        <option value="onion">प्याज (Onion)</option>
                        <option value="tomato">टमाटर (Tomato)</option>
                        <option value="potato">आलू (Potato)</option>
                    </select>
                </div>
            </div>

            <!-- 📍 लाइव क्रॉप प्रोडक्शन इन्फो ज़ोन -->
            <div class="info-box" id="cropInfoBox">
                <h3 id="infoTitle">📍 उत्पादन की जानकारी (Crop Production Data)</h3>
                <p id="infoContent" style="margin:0; font-size:14px; line-height: 1.5;"></p>
            </div>

            <button class="btn-predict" onclick="generateAIPrice()">AI प्रेडिक्शन और चार्ट देखें 🚀</button>
        </div>

        <div class="result-section" id="resultBox">
            <h2 id="resultHeader" style="color: var(--primary-color); margin-top:0;">🎯 प्रेडिक्शन परिणाम</h2>
            <div class="price-box">
                <div class="price-card">
                    <h3 style="margin:0; font-size:14px; color:#558b2f;">न्यूनतम भाव (Min Price)</h3>
                    <p class="price-value" id="minPrice">₹00.00</p>
                </div>
                <div class="price-card">
                    <h3>अधिकतम भाव (Max Price)</h3>
                    <p class="price-value" id="maxPrice">₹00.00</p>
                </div>
            </div>
            
            <div class="chart-container">
                <canvas id="predictionChart"></canvas>
            </div>
        </div>
    </div>
