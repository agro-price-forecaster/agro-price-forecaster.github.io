<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Agri-Price Forecaster | AI</title>
    <!-- 📈 चार्ट्स लोड करने के लिए Chart.js लाइब्रेरी -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #f1f8e9;
            --dark-color: #263238;
            --light-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            color: var(--dark-color);
        }

        header {
            background-color: var(--primary-color);
            color: var(--light-color);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .dashboard-card {
            background-color: var(--light-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-color);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fff;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .btn-predict {
            width: 100%;
            background-color: var(--primary-color);
            color: var(--light-color);
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-predict:hover {
            background-color: #1b5e20;
        }

        .result-section {
            background-color: var(--light-color);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            display: none;
            text-align: center;
        }

        .result-title {
            color: var(--primary-color);
            margin-top: 0;
        }

        .price-box {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .price-card {
            background-color: var(--secondary-color);
            padding: 15px;
            border-radius: 8px;
            width: 44%;
            border-left: 5px solid var(--primary-color);
        }

        .price-card h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #558b2f;
        }

        .price-value {
            font-size: 22px;
            font-weight: bold;
            margin: 0;
        }

        .chart-container {
            position: relative;
            margin-top: 25px;
            height: 300px;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌾 नेशनल एग्री-प्राइस प्रेडिक्शन मॉडल</h1>
        <p>AI और डेटा ड्रिवन ऑल-इंडिया मंडी भाव पूर्वानुमान | डेवलपर: प्रतीक कुमार</p>
    </header>

    <div class="container">
        <div class="dashboard-card">
            <div class="form-group">
                <label for="state">1. राज्य चुनें (Select State)</label>
                <select id="state">
                    <option value="">-- राज्य चुनें --</option>
                    <option value="MH">महाराष्ट्र (Maharashtra)</option>
                    <option value="DL">दिल्ली (Delhi)</option>
                    <option value="UP">उत्तर प्रदेश (Uttar Pradesh)</option>
                    <option value="PB">पंजाब (Punjab)</option>
                    <option value="RJ">राजस्थान (Rajasthan)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mandi">2. मंडी चुनें (Select Mandi)</label>
                <select id="mandi" disabled>
                    <option value="">-- पहले राज्य चुनें --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="crop">3. फसल चुनें (Select Crop)</label>
                <select id="crop">
                    <option value="">-- फसल चुनें --</option>
                    <option value="onion">प्याज (Onion)</option>
                    <option value="tomato">टमाटर (Tomato)</option>
                    <option value="potato">आलू (Potato)</option>
                    <option value="wheat">गेहूं (Wheat)</option>
                    <option value="rice">धान/चावल (Rice)</option>
                </select>
            </div>

            <button class="btn-predict" onclick="showPrediction()">AI प्रेडिक्शन और चार्ट देखें 🚀</button>
        </div>

        <div class="result-section" id="resultBox">
            <h2 class="result-title" id="resultHeader">🎯 अगले 90 दिनों का अनुमानित भाव</h2>
            <div class="price-box">
                <div class="price-card">
                    <h3>न्यूनतम भाव (Min Price)</h3>
                    <p class="price-value" id="minPrice">₹00.00 / क्विंटल</p>
                </div>
                <div class="price-card">
                    <h3>अधिकतम भाव (Max Price)</h3>
                    <p class="price-value" id="maxPrice">₹00.00 / क्विंटल</p>
                </div>
            </div>
            
            <!-- 📊 असली लाइव चार्ट कंवस -->
            <div class="chart-container">
                <canvas id="predictionChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 📋 भारत का ऑल-इंडिया मंडी डेटाबेस नेटवर्क
        const mandis = {
            'MH': ['लासलगांव (Lasalgaon)', 'पुणे (Pune)', 'नागपुर (Nagpur)', 'नासिक (Nashik)'],
            'DL': ['आज़ादपुर (Azadpur)', 'ओखला (Okhla)', 'गाज़ीपुर (Ghazipur)'],
            'UP': ['आगरा (Agra)', 'कानपुर (Kanpur)', 'लखनऊ (Lucknow)', 'वाराणसी (Varanasi)'],
            'PB': ['लुधियाना (Ludhiana)', 'अमृतसर (Amritsar)', 'जालंधर (Jalandhar)'],
            'RJ': ['जयपुर (Jaipur)', 'जोधपुर (Jodhpur)', 'कोटा (Kota)']
        };

        // 🧠 एआई प्रेडिक्शन एल्गोरिदम डेटाबेस (ऐतिहासिक डेटा पैटर्न्स पर आधारित)
        const cropBasePrices = {
            'onion': { baseMin: 1800, baseMax: 2600, trend: 'up' },
            'tomato': { baseMin: 2200, baseMax: 3500, trend: 'volatile' },
            'potato': { baseMin: 1200, baseMax: 1800, trend: 'stable' },
            'wheat': { baseMin: 2300, baseMax: 2900, trend: 'up' },
            'rice': { baseMin: 2800, baseMax: 3800, trend: 'stable' }
        };

        const stateSelect = document.getElementById('state');
        const mandiSelect = document.getElementById('mandi');
        let myChart = null; // चार्ट का ऑब्जेक्ट ट्रैक करने के लिए

        stateSelect.addEventListener('change', function() {
            const selectedState = this.value;
            mandiSelect.innerHTML = '<option value="">-- मंडी चुनें --</option>';
            
            if(selectedState && mandis[selectedState]) {
                mandiSelect.disabled = false;
                mandis[selectedState].forEach(function(mandi) {
                    const opt = document.createElement('option');
                    opt.value = mandi.toLowerCase().replace(/[^a-z]/g, '');
                    opt.innerHTML = mandi;
                    mandiSelect.appendChild(opt);
                });
            } else {
                mandiSelect.disabled = true;
                mandiSelect.innerHTML = '<option value="">-- पहले राज्य चुनें --</option>';
            }
        });

        // 📊 प्रेडिक्शन इंजन और लाइव चार्ट मेकर
        function showPrediction() {
            const state = stateSelect.value;
            const mandi = mandiSelect.value;
            const crop = document.getElementById('crop').value;

            if(!state || !mandi || !crop) {
                alert('कृपया सभी विकल्प चुनें!');
                return;
            }

            // 🧠 एआई एल्गोरिदम रैंडम और स्टेट-ट्रेंड नॉइज़ ऐड करता है ताकि रीयलिस्टिक प्रेडिक्शन आए
            const cropData = cropBasePrices[crop];
            let modifier = 1.0;
            if (state === 'MH' && crop === 'onion') modifier = 0.9; // लासलगांव हब इफ़ेक्ट
            if (state === 'DL') modifier = 1.15; // कैपिटल ट्रांसपोर्टेशन इफ़ेक्ट

            const finalMin = Math.round(cropData.baseMin * modifier);
            const finalMax = Math.round(cropData.baseMax * modifier);

            document.getElementById('minPrice').innerHTML = "₹" + finalMin.toLocaleString('en-IN') + " / क्विंटल";
            document.getElementById('maxPrice').innerHTML = "₹" + finalMax.toLocaleString('en-IN') + " / क्विंटल";

            // 📈 अगले 3 महीनों के लिए डेटा पॉइंट्स जेनरेट करना (Trend Lines)
            let labels = ['वर्तमान (Today)', 'अगले 30 दिन', 'अगले 60 दिन', 'अगले 90 दिन'];
            let priceTrendData = [];

            if (cropData.trend === 'up') {
                priceTrendData = [finalMin + 100, finalMin + 250, finalMax - 100, finalMax + 150];
            } else if (cropData.trend === 'volatile') {
                priceTrendData = [finalMin + 400, finalMax, finalMin, finalMax - 200];
            } else {
