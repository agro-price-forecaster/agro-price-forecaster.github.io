    <script>
        // Baseline pricing engine matrix mapping data
        const basePrices = {
            "आलू (Potato)": { min: 14, max: 26 }, "प्याज (Onion)": { min: 28, max: 52 }, "टमाटर (Tomato)": { min: 18, max: 36 },
            "लहसुन (Garlic)": { min: 110, max: 190 }, "अदरक (Ginger)": { min: 75, max: 135 }, "हरी मिर्च (Green Chillies)": { min: 38, max: 68 },
            "फूलगोभी (Cauliflower)": { min: 22, max: 44 }, "पत्तागोभी (Cabbage)": { min: 15, max: 30 }, "बैंगन (Brinjal)": { min: 18, max: 32 },
            "भिंडी (Lady Finger)": { min: 25, max: 50 }, "गाजर (Carrot)": { min: 20, max: 40 }, "मूली (Radish)": { min: 12, max: 25 },
            "पालक (Spinach)": { min: 15, max: 28 }, "मटर (Green Peas)": { min: 40, max: 80 }, "खीरा (Cucumber)": { min: 18, max: 35 },
            "कद्दू (Pumpkin)": { min: 10, max: 22 }, "शिमला मिर्च (Capsicum)": { min: 35, max: 70 }, "धनिया (Coriander)": { min: 25, max: 55 },
            "नींबू (Lemon)": { min: 50, max: 100 }, "गेहूं (Wheat)": { min: 24, max: 32 }
        };

        function searchLivePrices() {
            const state = document.getElementById("stateSelect").value;
            const mandi = document.getElementById("mandiSelect").value;
            const crop = document.getElementById("cropSelect").value;
            const card = document.getElementById("priceOutputCard");

            if (!state || !mandi || !crop) {
                alert("कृपया पहले तीनों विकल्पों को चुनें!");
                return;
            }

            let price = basePrices[crop] || { min: 20, max: 40 };
