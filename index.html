<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेशनल एग्री-प्राइस प्रेडिक्शन</title>
    <!-- Chart.js CDN for Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background-color: #1e5631;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
        }
        .form-body {
            padding: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 15px;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: #1e5631;
        }
        .btn-submit {
            width: 100%;
            background-color: #1e5631;
            color: white;
            border: none;
            padding: 14px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #143d22;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #e8f5e9;
            border-left: 5px solid #1e5631;
            border-radius: 4px;
            display: none;
        }
        .result-box h3 {
            color: #1e5631;
            margin-bottom: 10px;
        }
        .whatsapp-btn {
            display: inline-block;
            margin-top: 15px;
            background-color: #25d366;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .whatsapp-btn:hover {
            background-color: #1ebe5d;
        }
        .chart-container {
            margin-top: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌾 नेशनल एग्री-प्राइस प्रेडिक्शन</h1>
        <p>वास्तविक राज्यवार मंडी भाव एवं लाइव कृषि उत्पादन भौगोलिक डेटा | डेवलपर: प्रतीक कुमार</p>
    </div>

    <div class="form-body">
        <!-- 1. State Selection -->
        <div class="form-group">
            <label>1. राज्य चुनें (Select State)</label>
            <select id="stateSelect" onchange="updateMandis()">
                <option value="">--राज्य चुनें / Select State--</option>
            </select>
        </div>

        <!-- 2. Mandi Selection -->
        <div class="form-group">
            <label>2. मंडी चुनें (Select Mandi)</label>
            <select id="mandiSelect">
                <option value="">--पहले राज्य चुनें / Select State First--</option>
            </select>
        </div>

        <!-- 3. Crop Selection -->
        <div class="form-group">
            <label>3. फसल/सब्जी चुनें (Select Crop)</label>
            <select id="cropSelect">
                <option value="">--सब्जी या फसल चुनें / Select Crop--</option>
            </select>
        </div>

        <!-- Submit Button -->
        <button class="btn-submit" onclick="showPrice()">AI प्रेडिक्शन और चार्ट देखें 🚀</button>

        <!-- Result Display Box -->
        <div class="result-box" id="resultBox">
            <h3 id="resTitle">Result</h3>
            <p id="resDetails"></p>
            
            <!-- Price Trend Chart -->
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

            <!-- WhatsApp Share Button -->
            <a id="whatsappShare" href="#" target="_blank" class="whatsapp-btn">💬 WhatsApp पर शेयर करें</a>
        </div>
    </div>
</div>

<script>
    const data = {
        "Uttar Pradesh": {
            mandis: ["Azad Nagar Mandi (Lucknow)", "Muzaffarnagar Mandi", "Agra Mandi", "Varanasi Mandi"],
            crops: { "Aalu (Potato)": 20, "Pyaj (Onion)": 27, "Tamatar (Tomato)": 28, "Simla Mirch": 45, "Karela": 35, "Gobhi (Cauliflower)": 25 }
        },
        "Maharashtra": {
            mandis: ["Vashi APMC Mandi (Navi Mumbai)", "Lasalgaon Mandi (Nashik)", "Pune APMC Market", "Nagpur Mandi"],
            crops: { "Aalu (Potato)": 27, "Pyaj (Onion)": 24, "Tamatar (Tomato)": 31, "Simla Mirch": 52, "Karela": 38, "Gobhi (Cauliflower)": 30 }
        },
        "Bihar": {
            mandis: ["Musallahpur Mandi (Patna)", "Muzaffarpur Mandi", "Bhagalpur Market"],
            crops: { "Aalu (Potato)": 25, "Pyaj (Onion)": 30, "Tamatar (Tomato)": 35, "Simla Mirch": 52, "Karela": 40, "Gobhi (Cauliflower)": 30 }
        },
        "Rajasthan": {
            mandis: ["Muhana Mandi (Jaipur)", "Jodhpur Mandi", "Kota Grain Market", "Bikaner Mandi"],
            crops: { "Aalu (Potato)": 25, "Pyaj (Onion)": 27, "Tamatar (Tomato)": 33, "Simla Mirch": 52, "Karela": 40, "Gobhi (Cauliflower)": 32 }
        }
    };

    let myChart = null;

    window.onload = function() {
        const stateSelect = document.getElementById("stateSelect");
        for (let state in data) {
            let option = document.createElement("option");
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option);
        }
    };

    function updateMandis() {
        const selectedState = document.getElementById("stateSelect").value;
        const mandiSelect = document.getElementById("mandiSelect");
        const cropSelect = document.getElementById("cropSelect");

        mandiSelect.innerHTML = '<option value="">--मंडी चुनें / Select Mandi--</option>';
        cropSelect.innerHTML = '<option value="">--सब्जी या फसल चुनें / Select Crop--</option>';

        if (selectedState && data[selectedState]) {
            data[selectedState].mandis.forEach(mandi => {
                let option = document.createElement("option");
                option.value = mandi;
                option.textContent = mandi;
                mandiSelect.appendChild(option);
            });

            for (let crop in data[selectedState].crops) {
                let option = document.createElement("option");
                option.value = crop;
                option.textContent = crop;
                cropSelect.appendChild(option);
            }
        }
    }

    function showPrice() {
        const state = document.getElementById("stateSelect").value;
        const mandi = document.getElementById("mandiSelect").value;
        const crop = document.getElementById("cropSelect").value;
        const resultBox = document.getElementById("resultBox");
        const resTitle = document.getElementById("resTitle");
        const resDetails = document.getElementById("resDetails");
        const whatsappBtn = document.getElementById("whatsappShare");

        if (!state || !mandi || !crop) {
            alert("कृपया पहले राज्य, मंडी और फसल तीनों चुनें!");
            return;
        }

        let basePrice = data[state].crops[crop];
        let priceRange = `₹${basePrice - 5} - ₹${basePrice + 5} / kg`;

        resTitle.textContent = `📍 ${crop} का अनुमानित भाव`;
        resDetails.innerHTML = `<b>राज्य:</b> ${state} <br><b>मंडी:</b> ${mandi} <br><b>फसल:</b> ${crop} <br><b>वर्तमान एग्री-प्राइस:</b> <span style="color: #d32f2f; font-size: 18px; font-weight: bold;">${priceRange}</span>`;
        
        resultBox.style.display = "block";

        // Generate WhatsApp Share Link
        let shareText = `*National Agri-Price Prediction*%0A📍 State: ${state}%0A🏛️ Mandi: ${mandi}%0A🌾 Crop: ${crop}%0A💰 Price: ${priceRange}%0A_Developer: Prateek Kumar_`;
        whatsappBtn.href = `https://api.whatsapp.com/send?text=${shareText}`;

        // Render Chart
        renderChart(crop, basePrice);
    }

    function renderChart(cropName, basePrice) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        
        // Mock data for past 6 days trend based on base price
        const prices = [
            basePrice - 3, 
            basePrice - 2, 
            basePrice - 4, 
            basePrice + 1, 
            basePrice - 1, 
            basePrice
        ];

        if (myChart) {
            myChart.destroy(); // Destroy previous chart to avoid overlap
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['6 दिन पहले', '5 दिन पहले', '4 दिन पहले', '3 दिन पहले', 'कल', 'आज'],
                datasets: [{
                    label: `${cropName} का पिछले 6 दिनों का भाव (₹/kg)`,
                    data: prices,
                    borderColor: '#1e5631',
                    backgroundColor: 'rgba(30, 86, 49, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                }
            }
        });
    }
</script>

</body>
</html>
