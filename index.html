        }

        }

            margin-bottom: 8px;

            font-size: 15px;
        }

            font-size: 16px;

            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #b78103;

            font-weight: bold;

        }

    window.onload = function() {
        populateStates();
    };

    function populateStates() {
        const stateSelect = document.getElementById("stateSelect");
        stateSelect.innerHTML = `<option value="">${translations[currentLang].defaultState}</option>`;
        for (let state in data) {
            let option = document.createElement("option");
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option);
        }
    }

    function onStateChange() {
        const selectedState = document.getElementById("stateSelect").value;
        const districtSelect = document.getElementById("districtSelect");
        const mandiSelect = document.getElementById("mandiSelect");
        const cropSelect = document.getElementById("cropSelect");
        const stateInfoCard = document.getElementById("stateInfoCard");
        const stateInfoText = document.getElementById("stateInfoText");

        districtSelect.innerHTML = `<option value="">${translations[currentLang].defaultDistrict}</option>`;
        mandiSelect.innerHTML = `<option value="">${translations[currentLang].defaultMandi}</option>`;
        cropSelect.innerHTML = `<option value="">${translations[currentLang].defaultCrop}</option>`;

        if (selectedState && data[selectedState]) {
            stateInfoCard.style.display = "block";
            stateInfoText.textContent = data[selectedState].topCrop;

            // Populate Districts
            for (let district in data[selectedState].districts) {
                let option = document.createElement("option");
                option.value = district;
                option.textContent = district;
                districtSelect.appendChild(option);
            }

            // Populate Crops
            for (let crop in data[selectedState].crops) {
                let option = document.createElement("option");
                option.value = crop;
                option.textContent = crop;
                cropSelect.appendChild(option);
            }
        } else {
            stateInfoCard.style.display = "none";
        }
    }

    function onDistrictChange() {
        const selectedState = document.getElementById("stateSelect").value;
        const selectedDistrict = document.getElementById("districtSelect").value;
        const mandiSelect = document.getElementById("mandiSelect");

        mandiSelect.innerHTML = `<option value="">--मंडी चुनें / Select Mandi--</option>`;

        if (selectedState && selectedDistrict && data[selectedState].districts[selectedDistrict]) {
            let mandis = data[selectedState].districts[selectedDistrict];
            mandis.forEach(mandi => {
                let option = document.createElement("option");
                option.value = mandi;
                option.textContent = mandi;
                mandiSelect.appendChild(option);
            });
        }
    }

    function toggleLanguage() {
        currentLang = currentLang === 'hi' ? 'en' : 'hi';
        let t = translations[currentLang];

        document.getElementById("mainTitle").textContent = t.title;
        document.getElementById("subTitle").textContent = t.subtitle;
        document.getElementById("lblState").textContent = t.lblState;
        document.getElementById("lblDistrict").textContent = t.lblDistrict;
        document.getElementById("lblMandi").textContent = t.lblMandi;
        document.getElementById("lblCrop").textContent = t.lblCrop;
        document.getElementById("btnSubmitText").textContent = t.btnText;
        document.getElementById("voiceBtnText").textContent = t.voiceBtn;

        const currentState = document.getElementById("stateSelect").value;
        const currentDistrict = document.getElementById("districtSelect").value;
        populateStates();
        if(currentState) {
            document.getElementById("stateSelect").value = currentState;
            onStateChange();
            if(currentDistrict) {
                document.getElementById("districtSelect").value = currentDistrict;
                onDistrictChange();
            }
        }
    }

    function startVoiceSearch() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert(currentLang === 'hi' ? "आपका ब्राउज़र वॉइस सर्च सपोर्ट नहीं करता है!" : "Your browser does not support voice search!");
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = currentLang === 'hi' ? 'hi-IN' : 'en-US';
        
        recognition.onstart = function() {
            alert(currentLang === 'hi' ? "Listening... कृपया राज्य का नाम बोलें!" : "Listening... Please speak the State name!");
        };

        recognition.onresult = function(event) {
            const spokenText = event.results[0][0].transcript.toLowerCase();
            const stateSelect = document.getElementById("stateSelect");
            
            for (let i = 0; i < stateSelect.options.length; i++) {
                let stateName = stateSelect.options[i].text.toLowerCase();
                if (spokenText.includes(stateName)) {
                    stateSelect.selectedIndex = i;
                    onStateChange();
                    alert(currentLang === 'hi' ? `सफलतापूर्वक चुना गया: ${stateSelect.options[i].text}` : `Successfully selected: ${stateSelect.options[i].text}`);
                    return;
                }
            }
            alert(currentLang === 'hi' ? `"${spokenText}" नाम का राज्य सूची में नहीं मिला।` : `State matching "${spokenText}" not found.`);
        };

        recognition.start();
    }

    function showPrice() {
        const state = document.getElementById("stateSelect").value;
        const district = document.getElementById("districtSelect").value;
        const mandi = document.getElementById("mandiSelect").value;
        const crop = document.getElementById("cropSelect").value;
        const resultBox = document.getElementById("resultBox");
        const resTitle = document.getElementById("resTitle");
        const resDetails = document.getElementById("resDetails");
        const weatherWidget = document.getElementById("weatherWidget");
        const whatsappBtn = document.getElementById("whatsappShare");

        if (!state || !district || !mandi || !crop) {
            alert(currentLang === 'hi' ? "कृपया पहले राज्य, जिला, मंडी और फसल सभी चुनें!" : "Please select State, District, Mandi, and Crop first!");
            return;
        }

        let basePrice = data[state].crops[crop];
        let priceRange = `₹${basePrice - 5} - ₹${basePrice + 5} / kg`;

        let weatherText = currentLang === 'hi' ? 
            `🌤️ ${district}, ${state} (${mandi}) मौसम अपडेट: तापमान 27°C - 31°C, हल्की हवा, फसल कटाई के लिए उत्तम मौसम।` :
            `🌤️ ${district}, ${state} (${mandi}) Weather: Temp 27°C - 31°C, Gentle breeze, favorable for harvesting.`;
        weatherWidget.textContent = weatherText;

        resTitle.textContent = currentLang === 'hi' ? `📍 ${crop} का अनुमानित भाव` : `📍 Estimated Price for ${crop}`;
        
        if(currentLang === 'hi') {
            resDetails.innerHTML = `<b>राज्य:</b> ${state} <br><b>जिला:</b> ${district} <br><b>मंडी:</b> ${mandi} <br><b>फसल:</b> ${crop} <br><b>वर्तमान एग्री-प्राइस:</b> <span style="color: #d32f2f; font-size: 18px; font-weight: bold;">${priceRange}</span>`;
        } else {
            resDetails.innerHTML = `<b>State:</b> ${state} <br><b>District:</b> ${district} <br><b>Mandi:</b> ${mandi} <br><b>Crop:</b> ${crop} <br><b>Current Agri-Price:</b> <span style="color: #d32f2f; font-size: 18px; font-weight: bold;">${priceRange}</span>`;
        }
        
        resultBox.style.display = "block";

        let shareText = `*AGRO PRICE forecaster*%0A📍 State: ${state}%0A📌 District: ${district}%0A🏛️ Mandi: ${mandi}%0A🌾 Crop: ${crop}%0A💰 Price: ${priceRange}`;
        whatsappBtn.href = `https://api.whatsapp.com/send?text=${shareText}`;

        renderChart(crop, basePrice);
    }

    function renderChart(cropName, basePrice) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        
        const prices = [
            basePrice - 3, 
            basePrice - 2, 
            basePrice - 4, 
            basePrice + 1, 
            basePrice - 1, 
            basePrice
        ];

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: currentLang === 'hi' ? ['6 दिन पहले', '5 दिन पहले', '4 दिन पहले', '3 दिन पहले', 'कल', 'आज'] : ['6 Days Ago', '5 Days Ago', '4 Days Ago', '3 Days Ago', 'Yesterday', 'Today'],
                datasets: [{
                    label: currentLang === 'hi' ? `${cropName} का पिछले 6 दिनों का भाव (₹/kg)` : `${cropName} Price Trend (₹/kg)`,
                    data: prices,
                    borderColor: '#1e5631',
                    backgroundColor: 'rgba(30, 86, 49, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                }
            }
        });
    }
</script>

</body>
</html>
