<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेशनल एग्री-प्राइस प्रेडिक्शन मॉडल V4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
        }
        .header {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 20px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            color: #444;
            background-color: #fff;
            outline: none;
            transition: border 0.3s;
        }
        .form-group select:focus {
            border-color: #2e7d32;
        }
        .btn {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #1b5e20;
        }
        /* Results Section Card Box Styling */
        .result-card {
            display: none; /* Hidden by default until search clicked */
            background: #e8f5e9;
            border-left: 6px solid #2e7d32;
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card h3 {
            color: #1b5e20;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px dashed #a5d6a7;
            padding-bottom: 6px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
            color: #333;
        }
        .price-val {
            font-weight: bold;
            color: #2e7d32;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌾 नेशनल एग्री-प्राइस प्रेडिक्शन MODEL V4</h1>
        <p>वास्तविक राज्यवार मंडी भाव एवं लाइव कृषि उत्पादन भौगोलिक डेटा | डेवलपर: प्रतीक कुमार</p>
    </div>

    <div class="container">
        <!-- 1. State Input -->
        <div class="form-group">
            <label>1. राज्य चुनें (Select State)</label>
            <select id="stateSelect" onchange="updateMandis()">
                <option value="">--राज्य चुनें / Select State--</option>
            </select>
        </div>

        <!-- 2. Mandi Input -->
        <div class="form-group">
            <label>2. मंडी चुनें (Select Mandi)</label>
            <select id="mandiSelect">
                <option value="">--पहले राज्य चुनें / Select State First--</option>
            </select>
        </div>

        <!-- 3. Vegetable/Crop Input -->
        <div class="form-group">
            <label>3. फसल/सब्जी चुनें (Select Crop)</label>
            <select id="cropSelect">
                <option value="">--सब्जी या फसल चुनें / Select Crop--</option>
            </select>
        </div>

        <!-- Search Action Trigger -->
        <button class="btn" onclick="searchMandiPrices()">
            AI प्रेडिक्शन और चार्ट देखें 🚀
        </button>

        <!-- Dynamic Output Matrix Board -->
        <div class="result-card" id="priceOutputCard">
            <h3 id="resTitle">📊 लाइव मंडी भाव रिकॉर्ड</h3>
            <div class="price-row"><span>न्यूनतम भाव (Min Price):</span> <span class="price-val" id="minPrice">₹0 /kg</span></div>
            <div class="price-row"><span>अधिकतम भाव (Max Price):</span> <span class="price-val" id="maxPrice">₹0 /kg</span></div>
            <div class="price-row"><span>औसत भाव (Modal Price):</span> <span class="price-val" id="avgPrice">₹0 /kg</span></div>
        </div>
    </div>

    <script>
        // Data Structure mapping all 28 authentic Indian States with major local Mandis
        const agriData = {
            "Andhra Pradesh (आंध्र प्रदेश)": ["Guntur", "Kurnool", "Vijayawada", "Adoni"],
            "Arunachal Pradesh (अरुणाचल प्रदेश)": ["Pasighat", "Namsai", "Naharlagun"],
            "Assam (असम)": ["Guwahati", "Jorhat", "Silchar", "Nagaon"],
            "Bihar (बिहार)": ["Gulabbagh", "Muzaffarpur", "Patna", "Bhagalpur"],
            "Chhattisgarh (छत्तीसगढ़)": ["Raipur", "Durg", "Bilaspur", "Rajnandgaon"],
            "Goa (गोवा)": ["Margao", "Mapusa", "Panaji"],
            "Gujarat (गुजरात)": ["Gondal", "Rajkot", "Surat", "Ahmedabad"],
            "Haryana (हरियाणा)": ["Karnal", "Ambala", "Sirsa", "Rohtak"],
            "Himachal Pradesh (हिमाचल प्रदेश)": ["Shimla", "Solan", "Kullu", "Kangra"],
            "Jharkhand (झारखंड)": ["Ranchi", "Jamshedpur", "Dhanbad", "Hazaribagh"],
            "Karnataka (कर्नाटक)": ["Bengaluru", "Hubli", "Mysuru", "Tumakuru"],
            "Kerala (केरल)": ["Kochi", "Kozhikode", "Thiruvananthapuram", "Alappuzha"],
            "Madhya Pradesh (मध्य प्रदेश)": ["Indore", "Bhopal", "Ujjain", "Mandsaur"],
            "Maharashtra (महाराष्ट्र)": ["Pune (पुणे)", "Mumbai (मुंबई)", "Nashik (नाशिक)", "Nagpur (नागपुर)"],
            "Manipur (मणिपुर)": ["Imphal", "Thoubal"],
            "Meghalaya (मेघालय)": ["Shillong", "Tura"],
            "Mizoram (मिजोरम)": ["Aizawl", "Lunglei"],
            "Nagaland (नागालैंड)": ["Dimapur", "Kohima"],
            "Odisha (ओडिशा)": ["Bhubaneswar", "Cuttack", "Sambalpur", "Bargarh"],
            "Punjab (पंजाब)": ["Khanna", "Ludhiana", "Amritsar", "Jalandhar"],
            "Rajasthan (राजस्थान)": ["Jaipur", "Jodhpur", "Sri Ganganagar", "Kota"],
            "Sikkim (सिक्किम)": ["Gangtok", "Namchi"],
            "Tamil Nadu (तमिलनाडु)": ["Chennai", "Coimbatore", "Madurai", "Trichy"],
            "Telangana (तेलंगाना)": ["Warangal", "Nizamabad", "Khammam", "Hyderabad"],
            "Tripura (त्रिपुरा)": ["Agartala", "Udaipur"],
            "Uttar Pradesh (उत्तर प्रदेश)": ["Agra", "Kanpur", "Lucknow", "Varanasi"],
            "Uttarakhand (उत्तर प्रदेश)": ["Haldwani", "Dehradun", "Kashipur", "Rudrapur"],
            "West Bengal (पश्चिम बंगाल)": ["Kolkata", "Siliguri", "Burdwan", "Asansol"]
        };

        // Master lists of standard local items
        const cropsList = [
            "आलू (Potato)", "प्याज (Onion)", "टमाटर (Tomato)", "लहसुन (Garlic)", 
            "अदरक (Ginger)", "हरी मिर्च (Green Chillies)", "गोभी (Cauliflower)", 
            "बैंगन (Brinjal)", "भिंडी (Lady Finger)", "चना (Gram)", "गेहूं (Wheat)"
        ];

        // Central Baseline values mapping database
        const standardBasePrices = {
            "आलू (Potato)": { min: 14, max: 26 },
            "प्याज (Onion)": { min: 28, max: 50 },
            "टमाटर (Tomato)": { min: 16, max: 34 },
            "लहसुन (Garlic)": { min: 95, max: 160 },
            "अदरक (Ginger)": { min: 65, max: 120 },
            "हरी मिर्च (Green Chillies)": { min: 35, max: 60 },
            "गोभी (Cauliflower)": { min: 22, max: 42 },
            "बैंगन (Brinjal)": { min: 18, max: 32 },
            "भिंडी (Lady Finger)": { min: 25, max: 48 },
            "चना (Gram)": { min: 52, max: 78 },
            "गेहूं (Wheat)": { min: 24, max: 32 }
        };

        // Inject options on page mount
        window.onload = function() {
            const stateSelect = document.getElementById("stateSelect");
            const cropSelect = document.getElementById("cropSelect");

            for (let state in agriData) {
                let opt = document.createElement("option");
                opt.value = state;
                opt.innerHTML = state;
                stateSelect.appendChild(opt);
            }

            cropsList.forEach(crop => {
                let opt = document.createElement("option");
                opt.value = crop;
                opt.innerHTML = crop;
                cropSelect.appendChild(opt);
            });
        };

        // Cascade filter updates for dependent dropdown
        function updateMandis() {
            const stateSelect = document.getElementById("stateSelect");
            const mandiSelect = document.getElementById("mandiSelect");
            const selectedState = stateSelect.value;

            mandiSelect.innerHTML = '<option value="">--मंडी चुनें / Select Mandi--</option>';

            if (selectedState && agriData[selectedState]) {
                agriData[selectedState].forEach(mandi => {
                    let opt = document.createElement("option");
                    opt.value = mandi;
                    opt.innerHTML = mandi;
                    mandiSelect.appendChild(opt);
                });
