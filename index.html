<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGRO PRICE Forecaster - National Level AI Mandi System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 10px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #143d22;
            padding: 8px 15px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .voice-btn {
            background: #ffeb3b;
            color: #333;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .edition-badge {
            color: #ffffff;
            font-size: 11px;
            opacity: 0.9;
            font-weight: 500;
        }
        .header {
            background: linear-gradient(135deg, #1e5631, #143d22);
            color: white;
            padding: 20px 15px;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 11px;
            opacity: 0.9;
        }
        .form-body {
            padding: 20px 15px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2c3e50;
            font-size: 13px;
            line-height: 1.3;
        }
        select {
            width: 100%;
            padding: 11px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fafafa;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus {
            border-color: #1e5631;
        }
        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media(max-width: 500px) {
            .row-group {
                grid-template-columns: 1fr;
            }
        }
        .info-card {
            background: #fff8e1;
            border-left: 4px solid #ffc107;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #b78103;
            display: none;
            line-height: 1.4;
        }
        .btn-submit {
            width: 100%;
            background-color: #1e5631;
            color: white;
            border: none;
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .btn-submit:hover {
            background-color: #143d22;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px 15px;
            background: #e8f5e9;
            border-left: 5px solid #1e5631;
            border-radius: 6px;
            display: none;
        }
        .result-box h3 {
            color: #1e5631;
            margin-bottom: 12px;
            font-size: 17px;
        }
        .price-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        @media(max-width: 500px) {
            .price-cards { grid-template-columns: 1fr; }
        }
        .p-card {
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #c8e6c9;
        }
        .p-card h4 { font-size: 11px; color: #555; margin-bottom: 4px; }
        .p-card span { font-size: 14px; font-weight: bold; color: #1e5631; }
        .details-text {
            font-size: 13px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 15px;
        }
        .whatsapp-btn {
            display: inline-block;
            margin-top: 10px;
            background-color: #25d366;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .chart-container {
            margin-top: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <button class="voice-btn" onclick="startVoiceSearch()">🎙️ बोलकर खोजें (Voice)</button>
        <span class="edition-badge">🇮🇳 Created by Prateek Kumar</span>
    </div>

    <div class="header">
        <h1 id="mainTitle">🌾 AGRO PRICE Forecaster</h1>
        <p id="subTitle">Advanced AI-Driven Mandi Price Prediction System for India (States & UTs)</p>
    </div>

    <div class="form-body">
        <div class="form-group">
            <label id="labelState">1. राज्य / केंद्रशासित प्रदेश चुनें (Select State / UT)</label>
            <select id="stateSelect" onchange="loadDistricts()">
                <option value="">-- राज्य चुनें / Select State --</option>
            </select>
        </div>

        <div class="info-card" id="stateInfoCard">
            💡 <b id="infoTitle">प्रमुख विशेषता:</b> <span id="stateInfoText"></span>
        </div>

        <div class="row-group">
            <div class="form-group">
                <label id="labelDistrict">2. जिला चुनें (Select District)</label>
                <select id="districtSelect" onchange="loadMandis()">
                    <option value="">-- पहले राज्य चुनें --</option>
                </select>
            </div>

            <div class="form-group">
                <label id="labelMandi">3. मंडी चुनें (Select Mandi)</label>
                <select id="mandiSelect">
                    <option value="">-- पहले जिला चुनें --</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label id="labelCrop">4. फसल/सब्जी चुनें (Select Crop / Vegetable)</label>
            <select id="cropSelect">
                <option value="">-- सब्जी या फसल चुनें / Select Crop --</option>
            </select>
        </div>

        <button class="btn-submit" id="btnSubmitText" onclick="calculatePrice()">AI प्रेडिक्शन और चार्ट देखें 🚀</button>

        <div class="result-box" id="resultBox">
            <h3 id="resTitle">मंडी भाव रिपोर्ट</h3>
            
            <div class="price-cards">
                <div class="p-card">
                    <h4 id="minText">न्यूनतम भाव (Min)</h4>
                    <span id="minPriceVal">₹0 / kg</span>
                </div>
                <div class="p-card">
                    <h4 id="avgText">औसत भाव (Average)</h4>
                    <span id="avgPriceVal">₹0 / kg</span>
                </div>
                <div class="p-card">
                    <h4 id="maxText">अधिकतम भाव (Max)</h4>
                    <span id="maxPriceVal">₹0 / kg</span>
                </div>
            </div>

            <div class="details-text" id="resDetails"></div>

            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

            <a id="whatsappShare" href="#" target="_blank" class="whatsapp-btn">💬 WhatsApp पर भाव शेयर करें</a>
        </div>
    </div>
</div>

<script>
    // ... (baaki ka script code waisa hi rahega)
</script>

</body>
</html>
