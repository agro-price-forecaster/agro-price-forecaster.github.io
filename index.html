        const stateSelect = document.getElementById("stateSelect");
        stateSelect.innerHTML = `<option value="">${translations[currentLang].defaultState}</option>`;
        for (let state in data) {
            let option = document.createElement("option");
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option);
        }
    }

    function updateMandis() {
        const selectedState = document.getElementById("stateSelect").value;
        const mandiSelect = document.getElementById("mandiSelect");
        const cropSelect = document.getElementById("cropSelect");

        mandiSelect.innerHTML = `<option value="">${translations[currentLang].defaultMandi}</option>`;
        cropSelect.innerHTML = `<option value="">${translations[currentLang].defaultCrop}</option>`;

        if (selectedState && data[selectedState]) {
            data[selectedState].mandis.forEach(mandi => {
                let option = document.createElement("option");
                option.value = mandi;
                option.textContent = mandi;
                mandiSelect.appendChild(option);
            });

            for (let crop in data[selectedState].crops) {
                let option = document.createElement("option");
                option.value = crop;
                option.textContent = crop;
                cropSelect.appendChild(option);
            }
        }
    }

    function toggleLanguage() {
        currentLang = currentLang === 'hi' ? 'en' : 'hi';
        let t = translations[currentLang];

        document.getElementById("mainTitle").textContent = t.title;
        document.getElementById("subTitle").textContent = t.subtitle;
        document.getElementById("lblState").textContent = t.lblState;
        document.getElementById("lblMandi").textContent = t.lblMandi;
        document.getElementById("lblCrop").textContent = t.lblCrop;
        document.getElementById("btnSubmitText").textContent = t.btnText;

        const currentState = document.getElementById("stateSelect").value;
        populateStates();
        if(currentState) {
            document.getElementById("stateSelect").value = currentState;
        }
    }

    function showPrice() {
        const state = document.getElementById("stateSelect").value;
        const mandi = document.getElementById("mandiSelect").value;
        const crop = document.getElementById("cropSelect").value;
        const resultBox = document.getElementById("resultBox");
        const resTitle = document.getElementById("resTitle");
        const resDetails = document.getElementById("resDetails");
        const weatherWidget = document.getElementById("weatherWidget");
        const whatsappBtn = document.getElementById("whatsappShare");

        if (!state || !mandi || !crop) {
            alert(currentLang === 'hi' ? "कृपया पहले राज्य, मंडी और फसल तीनों चुनें!" : "Please select State, Mandi, and Crop first!");
            return;
        }

        let basePrice = data[state].crops[crop];
        let priceRange = `₹${basePrice - 5} - ₹${basePrice + 5} / kg`;

        // Dynamic Mock Weather based on region
        let weatherText = currentLang === 'hi' ? 
            `🌤️ ${state} (${mandi}) मौसम अपडेट: तापमान 27°C - 31°C, हल्की हवा, फसल कटाई के लिए उत्तम मौसम।` :
            `🌤️ ${state} (${mandi}) Weather: Temp 27°C - 31°C, Gentle breeze, favorable for harvesting.`;
        weatherWidget.textContent = weatherText;

        resTitle.textContent = currentLang === 'hi' ? `📍 ${crop} का अनुमानित भाव` : `📍 Estimated Price for ${crop}`;
        
        if(currentLang === 'hi') {
            resDetails.innerHTML = `<b>राज्य:</b> ${state} <br><b>मंडी:</b> ${mandi} <br><b>फसल:</b> ${crop} <br><b>वर्तमान एग्री-प्राइस:</b> <span style="color: #d32f2f; font-size: 18px; font-weight: bold;">${priceRange}</span>`;
        } else {
            resDetails.innerHTML = `<b>State:</b> ${state} <br><b>Mandi:</b> ${mandi} <br><b>Crop:</b> ${crop} <br><b>Current Agri-Price:</b> <span style="color: #d32f2f; font-size: 18px; font-weight: bold;">${priceRange}</span>`;
        }
        
        resultBox.style.display = "block";

        let shareText = `*National Agri-Price Prediction*%0A📍 State: ${state}%0A🏛️ Mandi: ${mandi}%0A🌾 Crop: ${crop}%0A💰 Price: ${priceRange}%0A_Developer: Prateek Kumar_`;
        whatsappBtn.href = `https://api.whatsapp.com/send?text=${shareText}`;

        renderChart(crop, basePrice);
    }

    function renderChart(cropName, basePrice) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        
        const prices = [
            basePrice - 3, 
            basePrice - 2, 
            basePrice - 4, 
            basePrice + 1, 
            basePrice - 1, 
            basePrice
        ];

        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: currentLang === 'hi' ? ['6 दिन पहले', '5 दिन पहले', '4 दिन पहले', '3 दिन पहले', 'कल', 'आज'] : ['6 Days Ago', '5 Days Ago', '4 Days Ago', '3 Days Ago', 'Yesterday', 'Today'],
                datasets: [{
                    label: currentLang === 'hi' ? `${cropName} का पिछले 6 दिनों का भाव (₹/kg)` : `${cropName} Price Trend (₹/kg)`,
                    data: prices,
                    borderColor: '#1e5631',
                    backgroundColor: 'rgba(30, 86, 49, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                }
            }
        });
    }
</script>

</body>
</html>
