<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नेशनल एग्री-प्राइस प्रेडिक्शन मॉडल V4</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
        }
        .header {
            background-color: #2e7d32;
            color: white;
            text-align: center;
            padding: 20px 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            color: #444;
            background-color: #fff;
            outline: none;
            transition: border 0.3s;
        }
        .form-group select:focus {
            border-color: #2e7d32;
        }
        .btn {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
            margin-bottom: 15px;
        }
        .btn:hover {
            background-color: #1b5e20;
        }
        .result-card {
            display: none;
            background: #e8f5e9;
            border-left: 6px solid #2e7d32;
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            animation: slideDown 0.3s ease-in-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-card h3 {
            color: #1b5e20;
            font-size: 16px;
            margin-bottom: 12px;
            border-bottom: 1px dashed #a5d6a7;
            padding-bottom: 6px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
            color: #333;
        }
        .price-val {
            font-weight: bold;
            color: #2e7d32;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🌾 नेशनल एग्री-प्राइस प्रेडिक्शन मॉडल V4</h1>
        <p>वास्तविक राज्यवार मंडी भाव एवं लाइव कृषि उत्पादन भौगोलिक डेटा | डेवलपर: प्रतीक कुमार</p>
    </div>

    <div class="container">
        <!-- 1. State Selector -->
        <div class="form-group">
            <label>1. राज्य चुनें (Select State)</label>
            <select id="stateSelect" onchange="updateMandis()">
                <option value="">--राज्य चुनें / Select State--</option>
            </select>
        </div>

        <!-- 2. Mandi Selector -->
        <div class="form-group">
            <label>2. मंडी चुनें (Select Mandi)</label>
            <select id="mandiSelect">
                <option value="">--पहले राज्य चुनें / Select State First--</option>
            </select>
        </div>

        <!-- 3. Vegetable Selector -->
        <div class="form-group">
            <label>3. फसल/सब्जी चुनें (Select Crop)</label>
            <select id="cropSelect">
                <option value="">--सब्जी या फसल चुनें / Select Crop--</option>
            </select>
        </div>

        <!-- Submit Button -->
        <button class="btn" onclick="searchMandiPrices()">
            AI प्रेडिक्शन और चार्ट देखें 🚀
        </button>

        <!-- Result Box Dashboard Display -->
        <div class="result-card" id="priceOutputCard">
            <h3 id="resTitle">📊 लाइव मंडी भाव रिकॉर्ड</h3>
            <div class="price-row"><span>न्यूनतम भाव (Min Price):</span> <span class="price-val" id="minPrice">₹0 /kg</span></div>
            <div class="price-row"><span>अधिकतम भाव (Max Price):</span> <span class="price-val" id="maxPrice">₹0 /kg</span></div>
            <div class="price-row"><span>औसत भाव (Modal Price):</span> <span class="price-val" id="avgPrice">₹0 /kg</span></div>
        </div>
    </div>

    <script>
        // Data Arrays mapping full 28 States & specific Mandis
        const agriData = {
            "Andhra Pradesh (आंध्र प्रदेश)": ["Guntur Mandi", "Kurnool Mandi", "Vijayawada Mandi", "Adoni Mandi"],
            "Arunachal Pradesh (अरुणाचल प्रदेश)": ["Pasighat Mandi", "Namsai Mandi", "Naharlagun Mandi"],
            "Assam (असम)": ["Guwahati Mandi", "Jorhat Mandi", "Silchar Mandi", "Nagaon Mandi"],
            "Bihar (बिहार)": ["Gulabbagh Mandi", "Muzaffarpur Mandi", "Patna Mandi", "Bhagalpur Mandi"],
            "Chhattisgarh (छत्तीसगढ़)": ["Raipur Mandi", "Durg Mandi", "Bilaspur Mandi", "Rajnandgaon Mandi"],
            "Goa (गोवा)": ["Margao Mandi", "Mapusa Mandi", "Panaji Mandi"],
            "Gujarat (गुजरात)": ["Gondal Mandi", "Rajkot Mandi", "Surat Mandi", "Ahmedabad Mandi"],
            "Haryana (हरियाणा)": ["Karnal Mandi", "Ambala Mandi", "Sirsa Mandi", "Rohtak Mandi"],
            "Himachal Pradesh (हिमाचल प्रदेश)": ["Shimla Mandi", "Solan Mandi", "Kullu Mandi", "Kangra Mandi"],
            "Jharkhand (झारखंड)": ["Ranchi Mandi", "Jamshedpur Mandi", "Dhanbad Mandi", "Hazaribagh Mandi"],
            "Karnataka (कर्नाटक)": ["Bengaluru Mandi", "Hubli Mandi", "Mysuru Mandi", "Tumakuru Mandi"],
            "Kerala (केरल)": ["Kochi Mandi", "Kozhikode Mandi", "Thiruvananthapuram Mandi", "Alappuzha Mandi"],
            "Madhya Pradesh (मध्य प्रदेश)": ["Indore Mandi", "Bhopal Mandi", "Ujjain Mandi", "Mandsaur Mandi"],
            "Maharashtra (महाराष्ट्र)": ["Pune Mandi (पुणे)", "Mumbai Mandi (मुंबई)", "Nashik Mandi (नाशिक)", "Nagpur Mandi (नागपुर)"],
            "Manipur (मणिपुर)": ["Imphal Mandi", "Thoubal Mandi"],
            "Meghalaya (मेघालय)": ["Shillong Mandi", "Tura Mandi"],
            "Mizoram (मिजोरम)": ["Aizawl Mandi", "Lunglei Mandi"],
            "Nagaland (नागालैंड)": ["Dimapur Mandi", "Kohima Mandi"],
            "Odisha (ओडिशा)": ["Bhubaneswar Mandi", "Cuttack Mandi", "Sambalpur Mandi", "Bargarh Mandi"],
            "Punjab (पंजाब)": ["Khanna Mandi", "Ludhiana Mandi", "Amritsar Mandi", "Jalandhar Mandi"],
            "Rajasthan (राजस्थान)": ["Jaipur Mandi", "Jodhpur Mandi", "Sri Ganganagar Mandi", "Kota Mandi"],
            "Sikkim (सिक्किम)": ["Gangtok Mandi", "Namchi Mandi"],
            "Tamil Nadu (तमिलनाडु)": ["Chennai Mandi", "Coimbatore Mandi", "Madurai Mandi", "Trichy Mandi"],
            "Telangana (तेलंगाना)": ["Warangal Mandi", "Nizamabad Mandi", "Khammam Mandi", "Hyderabad Mandi"],
            "Tripura (त्रिपुरा)": ["Agartala Mandi", "Udaipur Mandi"],
            "Uttar Pradesh (उत्तर प्रदेश)": ["Agra Mandi", "Kanpur Mandi", "Lucknow Mandi", "Varanasi Mandi"],
            "Uttarakhand (उत्तराखंड)": ["Haldwani Mandi", "Dehradun Mandi", "Kashipur Mandi", "Rudrapur Mandi"],
            "West Bengal (पश्चिम बंगाल)": ["Kolkata Mandi", "Siliguri Mandi", "Burdwan Mandi", "Asansol Mandi"]
        };

        const cropsList = [
            "आलू (Potato)", "प्याज (Onion)", "टमाटर (Tomato)", "लहसुन (Garlic)", 
            "अदरक (Ginger)", "हरी मिर्च (Green Chillies)", "गोभी (Cauliflower)", 
            "बैंगन (Brinjal)", "भिंडी (Lady Finger)", "चना (Gram)", "गेहूं (Wheat)"
        ];

        const standardBasePrices = {
            "आलू (Potato)": { min: 15, max: 28 },
            "प्याज (Onion)": { min: 30, max: 55 },
            "टमाटर (Tomato)": { min: 20, max: 40 },
            "लहसुन (Garlic)": { min: 100, max: 180 },
            "अदरक (Ginger)": { min: 70, max: 130 },
            "हरी मिर्च (Green Chillies)": { min: 35, max: 65 },
            "गोभी (Cauliflower)": { min: 25, max: 45 },
            "बैंगन (Brinjal)": { min: 18, max: 35 },
            "भिंडी (Lady Finger)": { min: 28, max: 50 },
            "चना (Gram)": { min: 55, max: 80 },
            "गेहूं (Wheat)": { min: 24, max: 32 }
        };

        // IMMEDIATE INITIALIZATION SYSTEM (Replaced window.onload)
        function initDropdowns() {
            const stateSelect = document.getElementById("stateSelect");
            const cropSelect = document.getElementById("cropSelect");

            // Fill State Selection
            for (let state in agriData) {
                let opt = document.createElement("option");
                opt.value = state;
                opt.text = state; // Safe standard DOM setter
                stateSelect.appendChild(opt);
            }

            // Fill Vegetables Selection
            cropsList.forEach(crop => {
                let opt = document.createElement("option");
                opt.value = crop;
                opt.text = crop;
                cropSelect.appendChild(opt);
            });
        }

        // Run Immediately as soon as script block loads on DOM
        initDropdowns();

        // Sequential Dependent Mandi Trigger Logic
        function updateMandis() {
